[workspace]
resolver = "3"
members = ["crates/ruxmsg-core", "crates/ruxmsg-net", "crates/ruxmsg-cli"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/bubzywubzy/RUXMSG"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
correctness = "deny"

[profile.dev]
opt-level = 0
debug = true
strip = 'none'
debug-assertions = true
overflow-checks = true
incremental = true

[profile.release]
panic = "unwind"
opt-level = 3
debug = 1
strip = "symbols"
codegen-units = 1
lto = "thin"
incremental = false
debug-assertions = false
overflow-checks = true
