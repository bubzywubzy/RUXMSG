[package]
name = "ruxmsg-core"
description = "RUXMSG/1 protocol core: sans-IO engine, wire format, cryptography. No sockets, threads, clocks or runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "ruxmsg_core"

[dependencies]
bip39 = { version = "2.2", default-features = false, features = ["std"] }
chacha20poly1305 = "0.10"
ciborium = "0.2"
ed25519-dalek = { version = "2.1", features = ["rand_core", "zeroize"] }
hkdf = "0.12"
hmac = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
subtle = "2.6"
thiserror = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
zeroize = { version = "1.8", features = ["derive"] }

[dev-dependencies]
proptest = "1"

[lints]
workspace = true
