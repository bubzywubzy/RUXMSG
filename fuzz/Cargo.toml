[package]
name = "ruxmsg-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
zeroize = "1.8"
ruxmsg = { package = "ruxmsg-core", path = "../crates/ruxmsg-core" }
ruxmsg-cli = { path = "../crates/ruxmsg-cli" }

[[bin]]
name = "frame_decode"
path = "fuzz_targets/frame_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "frame_cbor"
path = "fuzz_targets/frame_cbor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "handshake_decode"
path = "fuzz_targets/handshake_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "data_decrypt"
path = "fuzz_targets/data_decrypt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "close_decode"
path = "fuzz_targets/close_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ratchet_state"
path = "fuzz_targets/ratchet_state.rs"
test = false
doc = false
bench = false

[[bin]]
name = "engine_inputs"
path = "fuzz_targets/engine_inputs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_parse"
path = "fuzz_targets/config_parse.rs"
test = false
doc = false
bench = false

[workspace]
